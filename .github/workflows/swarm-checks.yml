name: Swarm checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python engine
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/swarm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      # Every board command as a real process, as a member runs it: local runs call it in-process for speed.
      - run: SWARM_TEST_PROCESSES=1 python3 -B tests/check.py --all --only py

  plugin:
    name: Plugin validation and host tests
    runs-on: macos-15
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plugins/swarm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.5'
      - run: npm install --global @anthropic-ai/claude-code@2.1.330
      - run: bun test hooks/units.test.ts hooks/graph.test.tsx
      - name: Validate the plugin and type-check its hooks
        shell: bash
        run: |
          report="$RUNNER_TEMP/swarm-plugin-validation.log"
          claude plugin validate --strict . 2>&1 | tee "$report"
          if grep -qi 'not type-checked' "$report"; then
            exit 1
          fi
      - name: Validate the marketplace manifest
        working-directory: .
        run: claude plugin validate --strict .
      - run: claude plugin test .

  linux:
    name: Linux engine (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.8', '3.15']
    defaults:
      run:
        working-directory: plugins/swarm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: SWARM_TEST_PROCESSES=1 python3 -B tests/check.py --all --only py

  workflow:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check workflow syntax and shell scripts
        shell: bash
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
